name: Gradcode release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Gradcode release tag
        required: true
        default: gradcode-v0.1.0
      version:
        description: Binary version
        required: true
        default: 0.1.0

permissions:
  contents: write

concurrency:
  group: gradcode-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    if: github.repository == 'aryanbaburajan/gradcode'
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      OPENCODE_VERSION: ${{ inputs.version }}
      OPENCODE_CHANNEL: gradcode
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          [[ "$OPENCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "gradcode-v$OPENCODE_VERSION" ]]

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build Gradcode and embedded web UI
        run: bun run --cwd packages/cli script/build.ts --target=gradcode-linux-x64 --skip-install

      - name: Smoke test and package
        shell: bash
        run: |
          binary=packages/cli/dist/cli-linux-x64/bin/gradcode
          "$binary" --version | grep -Fx "gradcode v$OPENCODE_VERSION"
          "$binary" --help
          mkdir -p release/stage
          cp "$binary" LICENSE release/stage/
          tar -czf release/gradcode-linux-x64.tar.gz -C release/stage gradcode LICENSE
          cd release
          sha256sum gradcode-linux-x64.tar.gz > SHA256SUMS

      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" release/gradcode-linux-x64.tar.gz release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
